<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carro de curas</title>
<style>
/* --fondo es el papel tal como sale del render (con su tono), para que la página y el lienzo no se distingan. */
:root{--fondo:#f6f0e8}
html,body{margin:0;height:100%;background:var(--fondo);overflow:hidden}
#escena{position:fixed;inset:0;display:block;width:100%;height:100%}
html.transparente,html.transparente body{background:transparent}
</style>
</head>
<body>
<canvas id="escena"></canvas>
<script>
// Sin WebGL no hay carro: se avisa a la presentación, que muestra su respaldo.
if(!document.createElement('canvas').getContext('webgl2'))parent.postMessage({carroFallo:true},'*');
</script>
<!-- Three.js va copiado junto al carro al compilar (scripts/build.mjs): funciona sin conexión. -->
<script type="importmap">
{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}
</script>
<script type="module" src="./carro.js"></script>
</body>
</html>
