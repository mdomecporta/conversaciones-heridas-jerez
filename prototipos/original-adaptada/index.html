<link rel="stylesheet" href="../../tokens.css">
<style>

*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#151012;overflow:hidden}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:size;background:var(--paper);overflow:hidden}
#stage::after{content:"";position:absolute;inset:0;background:var(--grain);opacity:.05;pointer-events:none;z-index:9}

[data-a="0"]{--tone:#e46a5a;--tone-ink:#a5333a;--tone-soft:#fbe1da}
[data-a="1"]{--tone:#e46a5a;--tone-ink:#a5333a;--tone-soft:#fbe1da}
[data-a="2"]{--tone:#e3a24a;--tone-ink:#8a5a17;--tone-soft:#f8e8cf}
[data-a="3"]{--tone:#b58bb0;--tone-ink:#6e4669;--tone-soft:#efe2ee}
[data-a="4"]{--tone:#8fae8b;--tone-ink:#4a6a47;--tone-soft:#e2eddf}
[data-a="5"]{--tone:#d98a7a;--tone-ink:#743536;--tone-soft:#f6e1da}

#hilo{position:absolute;left:0;top:0;bottom:0;width:25cqw;background:var(--night);color:var(--night-ink);padding:5cqh 2.2cqw 4cqh;display:flex;flex-direction:column;z-index:3}
#hilo .acto{font:600 1.05cqw/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--tone)}

#hilo h1{font:500 2.5cqw/1.1 var(--display);letter-spacing:-.01em;text-wrap:balance}
#ruta{margin-top:auto;display:flex;flex-direction:column;gap:1.3cqh;border-left:1px dashed var(--night-line);padding-left:1.2cqw}
#ruta div{font:500 1cqw/1.2 var(--sans);color:var(--night-muted);position:relative}
#ruta div::before{content:"×";position:absolute;left:-1.62cqw;width:.9cqw;text-align:center;color:var(--night-muted)}
#ruta div.on{color:var(--night-ink)}
#ruta div.on::before{content:"";top:.25cqw;width:.75cqw;height:.75cqw;border-radius:50%;border:2px solid var(--tone);background:var(--night);left:-1.6cqw;animation:respira 2.4s var(--ease) infinite}
#ruta div.next{opacity:.55}#ruta div.next::before{content:"·"}
@keyframes respira{50%{box-shadow:0 0 0 .4cqw color-mix(in srgb,var(--tone) 25%,transparent)}}
#pie{position:absolute;left:27cqw;bottom:2cqh;font:400 .85cqw var(--sans);color:var(--muted);z-index:2}
/* Centro. */
#centro{position:absolute;left:27.5cqw;width:48cqw;top:5cqh;bottom:5.5cqh;display:flex;flex-direction:column;gap:2.2cqh;z-index:2}
#centro>*{animation:entra .7s var(--ease) both}
#centro>*:nth-child(2){animation-delay:.12s}#centro>*:nth-child(3){animation-delay:.24s}#centro>*:nth-child(4){animation-delay:.36s}
@keyframes entra{from{opacity:0;transform:translateY(1.5cqh)}}
.rot{font:700 .95cqw/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--tone-ink);margin-bottom:1.1cqh}
.chips{display:flex;flex-wrap:wrap;gap:.7cqw}
.chips span{font:600 1.25cqw/1 var(--sans);padding:.85cqw 1.15cqw;border-radius:99px;background:var(--tone-soft);color:var(--tone-ink)}
.chips.claro span{background:#fff;border:1px solid var(--line);color:var(--ink-soft)}
.cols{display:grid;gap:1cqw;grid-template-columns:repeat(var(--n,2),1fr)}
.col{background:#fff;border:1px solid var(--line);border-radius:1cqw;padding:1.5cqh 1.1cqw;position:relative;overflow:hidden}
.col::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.35cqw;background:var(--c,var(--tone))}
.col h3{font:600 1.35cqw/1.15 var(--sans);color:var(--c-ink,var(--ink));margin-bottom:.6cqh}
.col p{font:400 1.1cqw/1.35 var(--sans);color:var(--ink-soft)}
.col .big{font:300 4.2cqw/1 var(--display);color:var(--tone-ink)}
.col.no{--c:var(--blood);--c-ink:var(--blood-deep);background:var(--blush)}
.col.si{--c:var(--olive);--c-ink:var(--olive-ink);background:var(--olive-soft)}
.col.am{--c:#e3a24a;--c-ink:#8a5a17;background:#fbf0dc}
.col.museo{text-align:center;background:var(--serum);border-style:dashed}
.col.museo::before{display:none}
.col.museo small{font:700 .8cqw var(--sans);letter-spacing:.12em;color:var(--muted)}
.col.museo b{display:inline-block;margin-top:.8cqh;font:700 .85cqw var(--sans);text-transform:uppercase;letter-spacing:.1em;padding:.3cqw .7cqw;border-radius:99px;background:var(--blood);color:#fff}
.col.museo b.rev{background:#e3a24a}
.lista{list-style:none;padding:0;display:grid;gap:1cqh;grid-template-columns:repeat(var(--n,1),1fr)}
.lista li{font:500 1.3cqw/1.3 var(--sans);display:flex;gap:.9cqw;align-items:baseline;background:#fff;border:1px solid var(--line);border-radius:.8cqw;padding:1.1cqh 1cqw}
.lista li i{font:500 1.5cqw/1 var(--display);font-style:normal;color:var(--tone-ink);min-width:1.4cqw}
.lista li span small{display:block;font-weight:400;font-size:1.05cqw;color:var(--muted);margin-top:.3cqh}
.flujo{display:flex;align-items:stretch;gap:.6cqw}
.flujo>div{flex:1;background:var(--tone-soft);border-radius:.8cqw;padding:1.3cqh .8cqw;font:600 1.15cqw/1.2 var(--sans);color:var(--tone-ink);text-align:center;display:grid;place-items:center}
.flujo>i{align-self:center;color:var(--line-strong);font-style:normal;font-size:1.4cqw}
.nota{font:italic 400 1.35cqw/1.35 var(--display);color:var(--room-ink);border-left:3px solid var(--room);padding:.4cqh 0 .4cqh 1cqw}
.nota.sala::before{content:"A la sala · ";font:700 .9cqw var(--sans);letter-spacing:.1em;text-transform:uppercase;font-style:normal}
.balanza{display:grid;grid-template-columns:1fr 1fr;gap:1cqw}
.decalogo{display:grid;grid-template-columns:repeat(5,1fr);gap:.7cqw}
.decalogo div{background:#fff;border:1px solid var(--line);border-radius:.8cqw;padding:1.2cqh .8cqw;font:600 1.1cqw/1.25 var(--sans)}
.decalogo div i{display:block;font:300 2.2cqw/1 var(--display);font-style:normal;color:var(--blood);margin-bottom:.6cqh;text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--coral)}

.hoja{margin-top:auto;background:var(--sheet);border:1px solid var(--sheet-line);border-radius:1cqw;padding:1.6cqh 1.4cqw 1.6cqh 1.8cqw;position:relative;box-shadow:0 1cqh 3cqh -2cqh rgba(60,50,20,.35)}
.hoja::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.45cqw;border-radius:1cqw 0 0 1cqw;background:linear-gradient(var(--olive),var(--ochre))}

.hoja p{font:500 1.55cqw/1.3 var(--display);color:var(--olive-ink);text-wrap:pretty}
.hoja .f{display:inline-block;margin-top:1cqh;font:600 .85cqw/1.3 var(--sans);background:var(--olive);color:var(--olive-soft);border-radius:99px;padding:.3cqw .8cqw}

#voz{position:absolute;right:1.8cqw;width:21cqw;top:5cqh;bottom:5cqh;display:flex;flex-direction:column;z-index:2}
#sitio{height:30cqh;position:relative;flex:none}
#herida{position:absolute;inset:-6cqh -3cqw;transition:opacity .9s var(--ease),filter .9s var(--ease)}

#carro{position:absolute;inset:0;background:center/contain no-repeat url(../../carro/respaldo/reposo.png);transition:opacity .9s var(--ease),transform .9s var(--ease)}
#voz[data-who="u"] #carro,#voz[data-who="v"] #carro{opacity:0;transform:translateX(3cqw)}
#voz[data-who="r"] #herida{opacity:0;filter:blur(1.5cqw)}
#voz[data-who="v"] #herida{filter:hue-rotate(-25deg) saturate(.7)}
.quien{font:700 1cqw var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--blood);margin:1.5cqh 0 .8cqh}
.burbuja{font:500 1.55cqw/1.35 var(--sans);color:var(--herida-ink);background:var(--bubble-herida);border-radius:.3cqw 1.6cqw 1.6cqw 1.6cqw;padding:1.6cqh 1.3cqw;animation:entra .8s .3s var(--ease) both;text-wrap:pretty}
#voz[data-who="r"] .quien{color:var(--ink-soft)}
#voz[data-who="r"] .burbuja{background:#fff;border:1px solid var(--line-strong);color:var(--ink-soft);font-style:italic;border-radius:1.6cqw .3cqw 1.6cqw 1.6cqw}
#voz[data-who="r"] .burbuja s{text-decoration-color:var(--coral)}
.replica{margin-top:1.4cqh;font:500 1.2cqw/1.35 var(--sans);color:var(--herida-ink);background:var(--blush);border-radius:.3cqw 1.2cqw 1.2cqw 1.2cqw;padding:1.2cqh 1cqw;animation:entra .8s .9s var(--ease) both}
.replica::before{content:"Úrsula · ";font-weight:700;color:var(--blood)}
/* Portada. */
#stage.portada #hilo{width:100cqw;padding:9cqh 8cqw;justify-content:center}
#stage.portada #hilo h1{font-size:6.5cqw;max-width:60cqw;line-height:1}
#stage.portada #hilo .num{display:none}
#stage.portada #hilo .sub{font:italic 300 3cqw var(--display);color:var(--skin);margin-top:2cqh}
#stage.portada #hilo .autora{font:400 1.2cqw var(--sans);color:var(--night-muted);margin-top:5cqh}
#stage.portada #ruta{margin-top:5cqh;flex-direction:row;gap:2.5cqw;border:0}
#stage.portada #ruta div::before{display:none}
#stage.portada #ruta div{color:var(--night-ink)}
#stage.portada #centro,#stage.portada #pie{display:none}
#stage.portada #voz{z-index:4;top:18cqh;right:5cqw;width:28cqw}
#stage.portada .burbuja{font-size:1.8cqw}
#nav{position:fixed;right:12px;bottom:10px;font:500 12px var(--sans);color:rgba(255,255,255,.5);z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
const rot=h=>h?`<div class="rot">${esc(h)}</div>`:'';
const R={
 chips:b=>`<div>${rot(b.h)}<div class="chips${b.claro?' claro':''}">${b.items.map(i=>`<span>${esc(i)}</span>`).join('')}</div></div>`,
 cols:b=>`<div>${rot(b.h)}<div class="cols" style="--n:${b.n||2}">${b.items.map(c=>c.m?`<div class="col museo"><small>${esc(c.s.toUpperCase())}</small><h3>${esc(c.h)}</h3><b class="${c.e==='Revisar'?'rev':''}">${c.e}</b></div>`:`<div class="col ${c.c||''}">${c.big?`<div class="big">${c.big}</div>`:''}${c.h?`<h3>${esc(c.h)}</h3>`:''}${c.p?`<p>${esc(c.p)}</p>`:''}</div>`).join('')}</div></div>`,
 lista:b=>`<div>${rot(b.h)}<ol class="lista" style="--n:${b.n||1}">${b.items.map((i,k)=>{const [h,p]=Array.isArray(i)?i:[i];return `<li><i>${b.num?k+1:'·'}</i><span>${esc(h)}${p?`<small>${esc(p)}</small>`:''}</span></li>`}).join('')}</ol></div>`,
 flujo:b=>`<div class="flujo">${b.items.map(i=>`<div>${esc(i)}</div>`).join('<i>→</i>')}</div>`,
 nota:b=>`<div class="nota${b.sala?' sala':''}">${esc(b.t)}</div>`,
 rot:b=>`<div class="rot" style="font-size:1.25cqw;margin:0">${esc(b.t)}</div>`,
 balanza:b=>`<div class="cols"><div class="col no"><h3>${b.l.h}</h3><div class="chips claro" style="margin-top:1cqh">${b.l.items.map(i=>`<span>${i}</span>`).join('')}</div></div><div class="col si"><h3>${b.r.h}</h3><div class="chips claro" style="margin-top:1cqh">${b.r.items.map(i=>`<span>${i}</span>`).join('')}</div></div></div>`,
 decalogo:b=>`<div class="decalogo">${b.items.map((i,k)=>`<div><i>${String(k+1).padStart(2,'0')}</i>${esc(i)}</div>`).join('')}</div>`
};
const zone=$('.orb-zone');let n=0;
function show(i,dir=1){
 n=Math.max(0,Math.min(S.length-1,i));const s=S[n],st=$('#stage');
 st.dataset.a=s.a;st.classList.toggle('portada',!!s.portada);
 $('#hilo .acto').textContent=s.acto||`Acto ${s.a} · ${ACTOS[s.a]}`;
 $('#hilo .num').textContent=String(n+1).padStart(2,'0');
 $('#hilo h1').textContent=s.t;
 $('#hilo .extra').innerHTML=s.portada?'<div class="sub">Confesiones de una úlcera</div><div class="autora">María del Mar Candil Ramón · EPA-HCC · AGS Campo de Gibraltar Este</div>':'';
 $('#ruta').innerHTML=(s.portada?ACTOS.slice(1,5).map((a,k)=>`Acto ${k+1} · ${a}`):ACTOS.map(a=>a)).map((a,k)=>`<div class="${s.portada?'':k===s.a?'on':k>s.a?'next':''}">${a}</div>`).join('');
 $('#centro').innerHTML=(s.b||[]).map(b=>R[b.k](b)).join('')+(s.ev?`<div class="hoja"><div class="rot">Doña Evidencia dice</div><p>${esc(s.ev)}</p><span class="f">${esc(s.f)}</span></div>`:'');
 $('#pie').textContent=`Fuente: ${s.f||''} · ${String(n+1).padStart(2,'0')} / ${S.length}${s.adapt?' · frase de Doña Rutina añadida en la adaptación':''}`;
 const v=$('#voz');v.dataset.who=s.who;
 $('.quien').textContent=s.quien||(s.who==='r'?'El carro · Doña Rutina':'Úrsula · la herida');
 const bu=$('.burbuja');bu.textContent=`«${s.q}»`;bu.style.animation='none';bu.offsetWidth;bu.style.animation='';
 $('.replica')?.remove();if(s.re)bu.insertAdjacentHTML('afterend',`<div class="replica">${esc(s.re)}</div>`);
 Presence.reset();zone.dataset.state=s.who==='r'?'idle':'speaking';Presence.mount([zone],{motion:!matchMedia('(prefers-reduced-motion:reduce)').matches});
 if(s.who!=='r')Presence.cue('speaking',{delay:400,think:600,speak:s.q.split(' ').length*60+400});
 $('#nav').textContent=`${n+1} / ${S.length} · ← →`;
 history.replaceState(null,'','#'+(n+1));
}
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key))show(n+1);else if(['ArrowLeft','PageUp'].includes(e.key))show(n-1,-1);else if(e.key==='Home')show(0);else if(e.key==='End')show(S.length-1);else if(e.key==='f')document.documentElement.requestFullscreen?.();});
$('#stage').addEventListener('click',e=>show(e.clientX>innerWidth/2?n+1:n-1));
show((parseInt(location.hash.slice(1))||1)-1);
</script>
